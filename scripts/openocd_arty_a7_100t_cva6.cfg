# OpenOCD config: CVA6 (ariane_xilinx) on the Digilent Arty A7-100T
#
# The Arty has no separate JTAG header: the debug module is reached through the
# FPGA's BSCANE2 user TAP (riscv-dbg's dmi_bscane_tap.sv) on the onboard
# FT2232H configuration chain (channel A). So the expected IDCODE is the
# FPGA's own (0x13631093, xc7a100t), the IR is 6 bits, and the DTM registers
# sit on the BSCANE2 user chains: IDCODE 0x09, DTMCS = USER3 (0x22),
# DMI = USER4 (0x23).
#
# Memory goes through system bus access (fast loads into DDR at 0x80000000).
# gdb on :3333, telnet on :4444. Used by scripts/boot_jtag.sh.

adapter driver ftdi
transport select jtag

ftdi device_desc "Digilent USB Device"
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0088 0x008b

reset_config none

set _CHIPNAME riscv

# Arty A7-100T silicon IDCODE
set _EXPECTED_ID 0x13631093

jtag newtap $_CHIPNAME cpu -irlen 6 -expected-id $_EXPECTED_ID -ignore-version
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

riscv set_ir idcode 0x09
riscv set_ir dtmcs 0x22
riscv set_ir dmi 0x23

adapter speed 10000

riscv set_mem_access sysbus
gdb_report_data_abort enable
gdb_report_register_access_error enable
gdb_breakpoint_override hard

init
halt
echo "Ready for Remote Connections"
